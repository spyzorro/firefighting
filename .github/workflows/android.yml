name: Build single APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Print Firebase SHA-1
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey | grep SHA1 || true

      - name: Prepare single APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/fire-salary-manager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fire-salary-manager-single-apk
          path: output/fire-salary-manager.apk
